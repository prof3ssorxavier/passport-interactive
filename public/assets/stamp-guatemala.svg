<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="340" height="220" fill="none">
  <!-- Outer Immigration Stamp Border -->
  <rect x="10" y="10" width="320" height="200" rx="22" stroke="#1D5B6B" stroke-width="5" />
  <rect x="20" y="20" width="300" height="180" rx="15" stroke="#1D5B6B" stroke-width="2" stroke-dasharray="10 4" />

  <!-- Corner Security Dots -->
  <circle cx="38" cy="38" r="3.5" fill="#1D5B6B" />
  <circle cx="302" cy="38" r="3.5" fill="#1D5B6B" />
  <circle cx="38" cy="182" r="3.5" fill="#1D5B6B" />
  <circle cx="302" cy="182" r="3.5" fill="#1D5B6B" />

  <!-- Top Authority Header -->
  <text x="170" y="54" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" letter-spacing="2.5" fill="#1D5B6B">
    MIGRACIÓN GUATEMALA
  </text>
  <line x1="48" y1="66" x2="292" y2="66" stroke="#1D5B6B" stroke-width="1.5" />

  <!-- Entry Badge & Airplane Icon -->
  <g transform="translate(56, 86)">
    <path d="M 4,14 L 18,14 L 26,2 L 30,2 L 25,14 L 38,14 L 42,9 L 45,9 L 43,16 L 45,23 L 42,23 L 38,18 L 25,18 L 30,30 L 26,30 L 18,18 L 4,18 C 1,18 1,14 4,14 Z" fill="#1D5B6B" />
  </g>
  <text x="190" y="109" text-anchor="middle" font-family="'Courier New', monospace" font-size="24" font-weight="700" letter-spacing="4" fill="#1D5B6B">
    ENTRADA
  </text>

  <!-- Date Box -->
  <rect x="74" y="122" width="192" height="36" rx="4" stroke="#1D5B6B" stroke-width="2" />
  <text x="170" y="147" text-anchor="middle" font-family="'Courier New', monospace" font-size="21" font-weight="700" letter-spacing="3" fill="#1D5B6B">
    OCT 2026
  </text>

  <!-- Bottom Port of Entry -->
  <text x="170" y="182" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#1D5B6B">
    AERO. LA AURORA • GUA • 90 DÍAS
  </text>
</svg>
