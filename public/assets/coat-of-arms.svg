<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440" fill="none">
  <defs>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DF89" />
      <stop offset="48%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B0891E" />
    </linearGradient>
    <path id="ribbonArc" d="M 88,365 Q 200,398 312,365" />
    <!-- Symmetrical Hummingbird silhouette positioned on the left side facing right -->
    <g id="hummingbird">
      <path d="M 86,184 C 66,144 38,116 14,108 C 28,132 42,158 64,182 C 42,162 24,146 12,140 C 26,162 46,180 72,194 Z" fill="url(#goldFoil)" />
      <path d="M 74,196 C 52,188 30,192 16,204 C 38,206 58,208 78,208 Z" fill="url(#goldFoil)" opacity="0.92" />
      <path d="M 86,184 C 98,176 112,174 120,180 C 125,184 124,194 116,204 C 106,216 92,226 76,232 C 80,218 82,204 86,184 Z" fill="url(#goldFoil)" />
      <path d="M 120,180 L 146,174 L 122,186 Z" fill="url(#goldFoil)" />
      <path d="M 76,232 C 62,248 44,264 30,276 C 48,270 64,258 78,244 C 72,262 62,276 54,286 C 70,274 82,256 90,236 Z" fill="url(#goldFoil)" />
      <circle cx="114" cy="182" r="2.2" fill="#102A4C" />
    </g>
  </defs>

  <!-- Top heraldic star crest -->
  <g transform="translate(200, 48)">
    <polygon points="0,-24 5.5,-7.5 22,-7.5 8.5,3 13.5,19 0,9.5 -13.5,19 -8.5,3 -22,-7.5 -5.5,-7.5" fill="url(#goldFoil)" />
    <circle cx="-34" cy="6" r="3" fill="url(#goldFoil)" />
    <circle cx="34" cy="6" r="3" fill="url(#goldFoil)" />
    <path d="M -52,22 Q 0,4 52,22" stroke="url(#goldFoil)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Left Hummingbird -->
  <use href="#hummingbird" />

  <!-- Right Hummingbird (exact horizontal mirror) -->
  <g transform="translate(400, 0) scale(-1, 1)">
    <use href="#hummingbird" />
  </g>

  <!-- Central Heraldic Shield -->
  <g>
    <path
      d="M 122,94 L 278,94 L 278,196 C 278,266 238,308 200,328 C 162,308 122,266 122,196 Z"
      stroke="url(#goldFoil)"
      stroke-width="6"
      fill="none"
    />
    <path
      d="M 134,106 L 266,106 L 266,194 C 266,256 232,294 200,312 C 168,294 134,256 134,194 Z"
      stroke="url(#goldFoil)"
      stroke-width="2"
      fill="none"
      opacity="0.85"
    />
    <circle cx="144" cy="116" r="2.5" fill="url(#goldFoil)" />
    <circle cx="256" cy="116" r="2.5" fill="url(#goldFoil)" />

    <!-- Custom Heraldic Tangerine traced from user photo: whole fruit + 2 right leaves + 3 peeled wedges -->
    <g transform="translate(198, 206)">
      <!-- Upper-right pointed citrus leaf -->
      <path
        d="M 10,-28 C 18,-54 44,-66 60,-60 C 56,-36 38,-18 14,-16 Z"
        fill="url(#goldFoil)"
      />
      <path d="M 16,-24 Q 36,-42 54,-56" stroke="#102A4C" stroke-width="1.8" stroke-linecap="round" opacity="0.65" />

      <!-- Lower-right secondary citrus leaf behind wedges -->
      <path
        d="M 20,-10 C 36,-22 54,-18 62,-4 C 48,4 32,4 20,-4 Z"
        fill="url(#goldFoil)"
        opacity="0.9"
      />

      <!-- Whole round tangerine body (left-center) -->
      <ellipse cx="-18" cy="-8" rx="40" ry="37" fill="url(#goldFoil)" />

      <!-- Natural calyx stem star & radiating dimples at upper crown (matching photo) -->
      <g transform="translate(-18, -32)">
        <circle cx="0" cy="0" r="4.2" fill="#102A4C" />
        <path
          d="M 0,-9 L 2.2,-3 L 8.5,-4 L 3.8,1 L 6.5,7 L 0,3.8 L -6.5,7 L -3.8,1 L -8.5,-4 L -2.2,-3 Z"
          fill="#102A4C"
          opacity="0.72"
        />
        <path d="M -14,2 Q -8,8 -2,10" stroke="#102A4C" stroke-width="1.5" stroke-linecap="round" opacity="0.45" />
        <path d="M 14,2 Q 8,8 2,10" stroke="#102A4C" stroke-width="1.5" stroke-linecap="round" opacity="0.45" />
      </g>

      <!-- Subtle citrus peel contour & pore texture -->
      <path d="M -44,-18 C -50,-4 -46,12 -34,20" stroke="#102A4C" stroke-width="2" stroke-linecap="round" opacity="0.42" />
      <circle cx="-32" cy="-6" r="1.6" fill="#102A4C" opacity="0.38" />
      <circle cx="-24" cy="8" r="1.6" fill="#102A4C" opacity="0.38" />
      <circle cx="-38" cy="4" r="1.4" fill="#102A4C" opacity="0.35" />

      <!-- Back peeled tangerine wedge (right-most) -->
      <path
        d="M 24,-4 C 42,-2 56,12 58,28 C 52,38 38,40 24,30 C 20,18 20,6 24,-4 Z"
        fill="url(#goldFoil)"
        stroke="#102A4C"
        stroke-width="2.2"
      />

      <!-- Left foreground peeled wedge (angled under whole fruit) -->
      <path
        d="M 6,16 C -4,26 -10,40 -4,52 C 6,56 20,48 26,34 C 22,24 14,18 6,16 Z"
        fill="url(#goldFoil)"
        stroke="#102A4C"
        stroke-width="2.2"
      />

      <!-- Primary center-right foreground peeled tangerine wedge (iconic crescent from photo) -->
      <path
        d="M 20,2 C 32,6 44,24 44,44 C 44,58 32,64 18,58 C 6,50 4,32 10,14 C 13,6 16,2 20,2 Z"
        fill="url(#goldFoil)"
        stroke="#102A4C"
        stroke-width="2.6"
      />
      <!-- Inner citrus pulp veining on primary wedge -->
      <path d="M 20,12 C 28,22 33,36 30,50" stroke="#102A4C" stroke-width="1.5" stroke-linecap="round" opacity="0.55" />
      <path d="M 15,24 L 26,20" stroke="#102A4C" stroke-width="1.2" stroke-linecap="round" opacity="0.48" />
      <path d="M 14,34 L 29,31" stroke="#102A4C" stroke-width="1.2" stroke-linecap="round" opacity="0.48" />
      <path d="M 16,44 L 29,43" stroke="#102A4C" stroke-width="1.2" stroke-linecap="round" opacity="0.48" />
    </g>
  </g>

  <!-- Curved Bottom Ribbon with 06.08.2026 -->
  <g>
    <path d="M 52,354 L 84,344 L 84,378 L 52,388 L 66,371 Z" fill="url(#goldFoil)" opacity="0.88" />
    <path d="M 348,354 L 316,344 L 316,378 L 348,388 L 334,371 Z" fill="url(#goldFoil)" opacity="0.88" />
    <path
      d="M 78,340 Q 200,378 322,340 L 322,380 Q 200,418 78,380 Z"
      fill="url(#goldFoil)"
    />
    <path d="M 86,348 Q 200,384 314,348" stroke="#102A4C" stroke-width="1.4" opacity="0.65" />
    <path d="M 86,372 Q 200,408 314,372" stroke="#102A4C" stroke-width="1.4" opacity="0.65" />
    <text
      font-family="Georgia, 'Times New Roman', serif"
      font-size="22"
      font-weight="700"
      letter-spacing="4"
      fill="#102A4C"
      text-anchor="middle"
    >
      <textPath href="#ribbonArc" startOffset="50%">06.08.2026</textPath>
    </text>
  </g>
</svg>
